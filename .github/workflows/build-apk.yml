name: Build APK

on:
  push:
    branches: [main, env/test]
  pull_request:
    branches: [main, env/test]
  workflow_dispatch:

# Cancela corridas anteriores del mismo ref si llega un nuevo push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.32.0"
  NDK_VERSION: "26.3.11579264"

jobs:
  # Qué entorno le toca a esta corrida. Sale de la rama y de nada más: `main` es
  # producción y todo lo demás es pruebas. Va en un job aparte porque
  # `environment:` se resuelve ANTES de que corra ningún paso, así que no puede
  # depender de una variable calculada dentro del propio job.
  #
  # En un pull request la rama que manda es la de destino (`base_ref`): `github.ref_name`
  # vale "123/merge" y no se parece a ninguna de las dos.
  contexto:
    name: Entorno de la corrida
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.decidir.outputs.entorno }}
      flavor: ${{ steps.decidir.outputs.flavor }}
    steps:
      - id: decidir
        run: |
          RAMA="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "$RAMA" = "main" ]; then
            # El sabor de Gradle se llama `prod`, igual que el entorno.
            echo "entorno=prod"   >> "$GITHUB_OUTPUT"
            echo "flavor=prod"    >> "$GITHUB_OUTPUT"
          else
            # OJO: el sabor NO se llama `test`. El Android Gradle Plugin rechaza
            # los nombres de sabor que empiezan por "test" (chocan con sus source
            # sets de pruebas instrumentadas), así que en Gradle es `pruebas`.
            # Es el único sitio donde la palabra cambia.
            echo "entorno=test"   >> "$GITHUB_OUTPUT"
            echo "flavor=pruebas" >> "$GITHUB_OUTPUT"
          fi
          echo "Rama '$RAMA' → entorno $(grep entorno= "$GITHUB_OUTPUT" | cut -d= -f2)"

  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true # cachea el SDK de Flutter
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    name: Build APK
    needs: [contexto, analyze-test]
    runs-on: ubuntu-latest
    # Da acceso a los secrets del entorno que toque (ADMIN_EMAIL/ADMIN_PASSWORD
    # y TILE_API_KEY): los de `prod` desde `main`, los de `test` desde
    # `env/test`. Es lo que impide que un APK de pruebas se publique con la
    # cuenta de administrador de producción.
    environment: ${{ needs.contexto.outputs.entorno }}
    # `actions: write` es lo que permite borrar artifacts de corridas anteriores
    # (paso "Liberar cuota de artifacts"). Se declaran los dos porque nombrar el
    # bloque `permissions` deja el resto en `none`.
    permissions:
      contents: read
      actions: write
    steps:
      # Va PRIMERO, antes de instalar Java, Flutter y el NDK: si el entorno no se
      # puede resolver, que falle en cinco segundos y no en cinco minutos.
      #
      # `vars.API_BASE_URL` es una variable DEL ENTORNO de GitHub (`prod` /
      # `test`) y sigue mandando cuando está puesta: es la vía para apuntar una
      # rama a otro backend sin tocar el workflow.
      #
      # **Sin ella hay default, y el default sale del ENTORNO — nunca uno solo.**
      # El guardarraíl que aquí había (fallar en seco) protegía de un riesgo real:
      # una app de pruebas hablando con el backend de producción no da error, no
      # se ve en una captura, y lo que escribe es de verdad. Ese riesgo lo trae un
      # default **único**, no un default por entorno: con la tabla de abajo, `main`
      # solo puede caer en producción y `env/test` solo en pruebas, que es
      # exactamente la garantía que daba la variable. Lo que se pierde es tener
      # que declararla en GitHub antes del primer build, y eso costaba un rojo por
      # una configuración que la rama ya contesta.
      - name: Resolver el entorno de destino
        env:
          ENTORNO: ${{ needs.contexto.outputs.entorno }}
          FLAVOR: ${{ needs.contexto.outputs.flavor }}
          API_BASE_URL_DECLARADA: ${{ vars.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL_DECLARADA:-}"
          if [ -n "$API_BASE_URL" ]; then
            echo "API_BASE_URL viene de la variable del environment '$ENTORNO'."
          else
            case "$ENTORNO" in
              prod) API_BASE_URL="https://api.zumbeo.com/Api" ;;
              test) API_BASE_URL="https://api-test.zumbeo.com/Api" ;;
              *)
                echo "::error::Entorno '$ENTORNO' desconocido: no hay default que aplicar."
                exit 1
                ;;
            esac
            echo "::warning::Sin la variable API_BASE_URL en el environment '$ENTORNO': se usa el default del entorno ($API_BASE_URL). Declárala en Settings → Environments → $ENTORNO → Variables si este entorno apunta a otro backend."
          fi
          echo "API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          echo "FLAVOR=$FLAVOR" >> "$GITHUB_ENV"
          echo "ENTORNO=$ENTORNO" >> "$GITHUB_ENV"
          echo "Entorno $ENTORNO · sabor $FLAVOR · API $API_BASE_URL"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # cachea ~/.gradle según los archivos gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true # cachea el SDK de Flutter y el pub-cache

      # El NDK pesa cientos de MB y es lo que más tardaba en instalarse.
      # Resolvemos su ruta real (el contexto `env.*` no ve las variables del runner).
      - name: Resolver ruta del NDK
        run: echo "NDK_DIR=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # En cache-miss, `flutter build` instala el NDK en esa ruta y el caché lo
      # guarda al final del job; en cache-hit se restaura y se omite la descarga.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - run: flutter pub get

      # Firma de release. Sin los secrets el build sigue (firmado con la clave de
      # debug) y solo sirve para instalar a mano: el .aab de Play necesita la clave
      # de subida de verdad. Se avisa en el log para que no pase inadvertido.
      - name: Preparar la firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el release se firmará con la clave de debug y Google Play lo rechazará."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=$(pwd)/android/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Firma de release lista."

      # El versionCode sale del número de build: Play exige uno estrictamente mayor
      # en cada subida y no se puede reutilizar. El versionName sigue saliendo del
      # pubspec, que es donde se declara la versión a mano.
      # La cuota de almacenamiento de artifacts es de la CUENTA, no del repo: la
      # comparten los seis. Al agotarse, `upload-artifact` falla con "Artifact
      # storage quota has been hit" en el repo que corra después, que no tiene por
      # qué ser el que la llenó — pasó una vez en el cliente con este mismo
      # workflow intacto. Se libera aquí, ANTES de subir nada, para que el espacio
      # esté disponible en esta misma corrida. GitHub recalcula el uso cada 6–12 h,
      # así que el desbloqueo puede no ser inmediato.
      - name: Liberar cuota de artifacts
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const CORRIDAS_A_CONSERVAR = 3;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );
            const vivos = artifacts.filter((a) => !a.expired);
            // Se conservan las N corridas más recientes (por id, que es creciente),
            // no los N artifacts: cada corrida sube varios y borrar a medias deja
            // símbolos sin su binario, que es justo la pareja que hace falta junta.
            const corridas = [...new Set(vivos.map((a) => a.workflow_run?.id).filter(Boolean))]
              .sort((a, b) => b - a)
              .slice(0, CORRIDAS_A_CONSERVAR);
            const conservar = new Set([...corridas, context.runId]);
            let borrados = 0;
            let bytes = 0;
            for (const a of vivos) {
              if (conservar.has(a.workflow_run?.id)) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              borrados += 1;
              bytes += a.size_in_bytes;
            }
            core.info(`Artifacts borrados: ${borrados} (${(bytes / 1e6).toFixed(0)} MB liberados).`);

      - name: Build release APK y App Bundle
        env:
          # Clave de Geoapify (tiles del mapa), secret del environment que toque.
          # Sin ella el build sale igual, pero el mapa cae al respaldo de
          # openstreetmap.org: ese uso en una app distribuida no está permitido y
          # bloquean por User-Agent sin avisar, así que se avisa en el log para
          # que un release no salga así por descuido.
          TILE_API_KEY: ${{ secrets.TILE_API_KEY }}
        run: |
          if [ -z "${TILE_API_KEY:-}" ]; then
            echo "::warning::Sin TILE_API_KEY: el mapa usará los tiles de openstreetmap.org, que no permiten este uso. Añade el secret en el environment '$ENTORNO'."
          fi
          # --obfuscate renombra los símbolos de Dart en el binario. No impide
          # decompilar, pero convierte un APK que se lee como código fuente
          # —nombres de clases, endpoints, la lógica de la comisión— en algo que
          # cuesta trabajo. --split-debug-info es obligatorio con él: saca los
          # símbolos a un directorio aparte, que se sube como artefacto porque
          # sin ellos una traza de error de producción es ilegible.
          # --flavor es obligatorio desde que el módulo declara sabores: sin él
          # Gradle no sabe qué construir. Esa es la garantía de que ningún APK
          # sale sin haber declarado su entorno.
          flutter build apk --release --flavor "$FLAVOR" \
            --obfuscate --split-debug-info=build/simbolos \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=TILE_API_KEY="$TILE_API_KEY"
          # El .aab solo se construye bajo demanda Y desde `main`: es lo que se
          # sube a Play a mano, no hace falta en cada commit, y son ~50 MB de
          # cuota de artifacts por corrida y por app — la mitad del consumo que
          # agotó el almacenamiento.
          #
          # Que salga solo de `main` no es una precaución de más: los canales de
          # prueba interna y cerrada de Play existen para probar el ARTEFACTO DE
          # PRODUCCIÓN, y un bundle del sabor `pruebas` lleva el applicationId
          # con sufijo — ni siquiera corresponde a la ficha publicada. Play lo
          # rechazaría, pero después de gastar la subida.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$ENTORNO" = "prod" ]; then
            flutter build appbundle --release --flavor "$FLAVOR" \
              --obfuscate --split-debug-info=build/simbolos \
              --build-number=${{ github.run_number }} \
              --dart-define=API_BASE_URL="$API_BASE_URL" \
              --dart-define=TILE_API_KEY="$TILE_API_KEY"
          else
            echo "Sin .aab: se construye solo con 'Run workflow' sobre main."
          fi

      # Sin estos símbolos, una traza de un crash del release no se puede leer.
      # Van con el mismo número de build que el binario que los produjo: son
      # inútiles si no se sabe a qué APK corresponden.
      #
      # Los tres uploads van con `continue-on-error`: la cuota de artifacts es un
      # recurso compartido de la cuenta y puede agotarla otro repo, así que no
      # puede decidir si el APK llega al panel admin (el paso de abajo), que es lo
      # único que este workflow existe para lograr. El fallo sigue viéndose en rojo
      # en el paso, pero ya no tumba el job.
      - name: Upload símbolos de depuración
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zumbeo-conductor-${{ env.ENTORNO }}-simbolos-${{ github.run_number }}
          path: build/simbolos
          if-no-files-found: error
          retention-days: 90

      # Retención corta a propósito: el APK se publica además en el panel admin
      # (R2) en el paso final, que es de donde se instala. Este artifact es solo
      # para bajarlo desde la corrida.
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zumbeo-conductor-${{ env.ENTORNO }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk
          if-no-files-found: error
          retention-days: 7

      # El .aab es lo que se sube a Play (a mano la primera vez: una ficha nueva no
      # acepta la primera subida por API). Solo existe en las corridas manuales.
      - name: Upload App Bundle artifact
        if: github.event_name == 'workflow_dispatch' && needs.contexto.outputs.entorno == 'prod'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: zumbeo-conductor-aab
          path: build/app/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
          if-no-files-found: error
          retention-days: 90

      # Publica el APK en el panel admin del ENTORNO DE SU RAMA (sube a R2 vía
      # /admin/releases). Requiere los secrets ADMIN_EMAIL y ADMIN_PASSWORD
      # (usuario ADMINISTRADOR) en el environment que corresponda —`prod` o
      # `test`—. Se omite solo en pull_request.
      #
      # Este paso FALLA si el APK no queda publicado, incluso por 502 del proxy.
      # Antes solo avisaba: el build salía verde y nadie se enteraba de que el
      # panel seguía sin el APK, que es justo lo único que este paso existe para
      # lograr. El artifact se sube en el paso anterior, así que un fallo aquí
      # nunca pierde el binario.
      - name: Publicar APK en el panel admin
        if: github.event_name != 'pull_request'
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP: CONDUCTOR
        run: |
          set -uo pipefail
          # El APK y el panel al que se sube salen los dos del entorno de la
          # rama: el de `env/test` va al panel de pruebas y el de `main` al de
          # producción. Nunca se cruzan, porque las credenciales de admin son
          # las del environment de GitHub que resolvió el job.
          APK="build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk"
          if [ -z "${ADMIN_PASSWORD:-}" ] || [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "::error::Faltan los secrets ADMIN_EMAIL/ADMIN_PASSWORD en el environment '$ENTORNO'. El APK quedó como artifact pero NO se publicó en el panel."
            exit 1
          fi
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          NOTAS="CI · ${ENTORNO} · commit ${GITHUB_SHA::7} · build #${GITHUB_RUN_NUMBER}"

          echo "Autenticando en $API_BASE_URL ..."
          # 10 intentos cada 30 s ≈ 5 min. Eran 6 cada 15 s (90 s), menos de lo que
          # tarda Dokploy en construir y arrancar el backend: un push que llega
          # mientras el backend se redespliega ponía el build en rojo por un 502 que
          # se resolvía solo un minuto después.
          LOGIN_CODE=$(curl -sS -o login.json -w '%{http_code}' \
            --retry 10 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST "$API_BASE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          TOKEN=$(jq -r '.token // empty' login.json)
          if [ -z "$TOKEN" ]; then
            echo "::error::Login de admin falló (HTTP $LOGIN_CODE). Revisa ADMIN_EMAIL/ADMIN_PASSWORD y que la cuenta tenga rol ADMINISTRADOR."
            exit 1
          fi

          echo "Subiendo APK v$VERSION ($APP, $(du -h "$APK" | cut -f1)) al panel ..."
          # Reintenta ante 5xx transitorios (Dokploy redesplegando → 502 del proxy).
          CODE=$(curl -sS -o publish.json -w '%{http_code}' \
            --retry 10 --retry-delay 30 --retry-all-errors --max-time 600 \
            -X POST "$API_BASE_URL/admin/releases" \
            -H "Authorization: Bearer $TOKEN" \
            -F "app=$APP" \
            -F "version=$VERSION" \
            -F "notas=$NOTAS" \
            -F "file=@$APK")
          echo "HTTP $CODE"
          head -c 500 publish.json || true
          if [ "$CODE" != "201" ]; then
            echo ""
            echo "::error::El APK $APP v$VERSION NO quedó publicado en el panel (HTTP $CODE). 413 = el proxy no permite el body; 403 = la cuenta no es ADMINISTRADOR; 502 = backend caído o redesplegando."
            exit 1
          fi
          echo "APK $APP v$VERSION publicado en el panel."
